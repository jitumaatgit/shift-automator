name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Run on /oc or /opencode. Issue comments require the issue carry
    # ready-for-agent or ready-for-human (HITL).
    # Public-repo safety: only the owner/collaborators may invoke the agent.
    # Anyone can comment on a public repo; without this gate a stranger could
    # spend the API key and prompt-inject the agent.
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (
        github.event_name == 'pull_request_review_comment' ||
        github.event.issue.pull_request != null ||
        contains(github.event.issue.labels.*.name, 'ready-for-agent') ||
        contains(github.event.issue.labels.*.name, 'ready-for-human')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode (GLM 5.2)
        id: primary
        uses: anomalyco/opencode/github@latest
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          model: nvidia/z-ai/glm-5.2
          share: false

      - name: Run opencode fallback (DeepSeek V4 Pro)
        if: steps.primary.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          model: nvidia/deepseek-ai/deepseek-v4-pro
          share: false