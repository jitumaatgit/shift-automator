name: Issue Implement

on:
  issues:
    types: [labeled]

jobs:
  implement:
    # Fires only when BOTH `ready-for-agent` AND `ticket` labels are present on
    # the issue after a label-add event. Order-tolerant: whichever label is
    # added second completes the pair and fires the runner exactly once.
    # `ready-for-agent` alone (specs / PRDs) does NOT fire — only tracer-bullet
    # implementation tickets (which also carry `ticket`) do. HITL
    # (`ready-for-human`) issues never fire this workflow; they can still get
    # one-shot help via an explicit /oc comment (see opencode.yml).
    if: contains(github.event.issue.labels.*.name, 'ready-for-agent') && contains(github.event.issue.labels.*.name, 'ticket')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode (GLM 5.2)
        id: primary
        uses: anomalyco/opencode/github@latest
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          model: nvidia/z-ai/glm-5.2
          share: false
          prompt: |
            Implement this ticket using the /implement skill methodology:
            - Read the issue body, comments, and any linked spec/tickets.
            - Follow the repo's AGENTS.md conventions.
            - Use TDD at pre-agreed seams where possible.
            - Run type checking regularly.
            - Run single test files regularly.
            - Run a full test sweep once at the end.
            - Compact or create a handoff before continuing if the work spans
              multiple sessions.
            - Open a pull request with the completed implementation.
            If the ticket is unclear, blocked, or out of scope, comment with
            what's blocking instead of opening a PR.

      - name: Run opencode fallback (DeepSeek V4 Pro)
        if: steps.primary.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          model: nvidia/deepseek-ai/deepseek-v4-pro
          share: false
          prompt: |
            Implement this ticket using the /implement skill methodology:
            - Read the issue body, comments, and any linked spec/tickets.
            - Follow the repo's AGENTS.md conventions.
            - Use TDD at pre-agreed seams where possible.
            - Run type checking regularly.
            - Run single test files regularly.
            - Run a full test sweep once at the end.
            - Compact or create a handoff before continuing if the work spans
              multiple sessions.
            - Open a pull request with the completed implementation.
            If the ticket is unclear, blocked, or out of scope, comment with
            what's blocking instead of opening a PR.