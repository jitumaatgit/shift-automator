name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Public-repo safety: skip fork PRs (no secrets are exposed to them and a
    # stranger's code should not drive the agent).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode (GLM 5.2)
        id: primary
        uses: anomalyco/opencode/github@latest
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          model: nvidia/z-ai/glm-5.2
          share: false
          prompt: |
            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs
            - Suggest improvements
            - Verify tests cover the changes

      - name: Run opencode fallback (DeepSeek V4 Pro)
        if: steps.primary.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          model: nvidia/deepseek-ai/deepseek-v4-pro
          share: false
          prompt: |
            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs
            - Suggest improvements
            - Verify tests cover the changes