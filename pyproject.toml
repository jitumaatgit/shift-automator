[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "shift-automator"
version = "1.0.0"
description = "Auto-accept/decline shift offers based on configurable rules"
requires-python = ">=3.11"
dependencies = [
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.1",
    "google-api-python-client>=2.120.0",
    "tzdata>=2024.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
shift-automator = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]